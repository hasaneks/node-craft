name: CI

# Manual for now: GitHub Actions is not enabled for this account. Every check here also runs locally with
# `npm run check`. Switch back to push and pull_request triggers when Actions is available.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - run: npm test

  contract-kit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fixtures/contract-kit
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - run: node .yarn/releases/yarn-4.18.1.cjs install --immutable
      - run: node .yarn/releases/yarn-4.18.1.cjs typecheck
      - run: node .yarn/releases/yarn-4.18.1.cjs test:unit
      - run: node .yarn/releases/yarn-4.18.1.cjs test:integration

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
